version: "3.9"

services:
  app:
    build:
      context: .
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
       - DJANGO_SETTINGS_MODULE=configs.settings
    ports:
      - "8888:8000"
    restart: on-failure
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

    depends_on:
      - redis

  redis:
    image: redis:alpine
    restart: on-failure

  celery:
    build:
      context: .
    volumes:
      - ./backend:/app
    env_file:
      - .env
    restart: on-failure
    depends_on:
      - app
      - redis
    command: >
      sh -c 'celery -A configs worker -l info'

  next-client:
    build:
      context: ./next-client
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    command: npm run start
    depends_on:
      - app

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/static:/drf-static
      - ./next-client/.next:/next-static
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
      - ./backend/storage:/media

    depends_on:
      - app
      - next-client

