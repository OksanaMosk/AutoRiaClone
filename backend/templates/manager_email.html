{% extends 'base.html' %}

{% block body %}
<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; text-align: center;">
  <h2 style="color: #333; margin-top: 0;">
    Ad Requires Review
  </h2>

  <p>
    The ad <strong>#{{ ad_id }}</strong> has been <strong>automatically locked</strong>
    after three unsuccessful edit attempts by the user.
  </p>

  <p style="margin: 30px 0;">
    <a href="http://localhost:3000/login"
       style="background-color: red; color: black; padding: 12px 24px;
              text-decoration: none; border-radius: 6px; display: inline-block;">
      Review Ad
    </a>
  </p>

  <p style="color: #555; margin-bottom: 0;">
    Please review the ad and decide whether it can be reactivated or should remain inactive.
  </p>
</div>
{% endblock %}
